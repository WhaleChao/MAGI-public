<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGI 登入</title>
    <style>
        body {
            margin: 0;
            background: #eef1f3;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
            overflow-x: hidden;
            box-sizing: border-box;
            color: #17202a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }

        .auth-shell {
            width: min(420px, calc(100vw - 28px));
            margin: 0 auto;
        }

        .auth-card {
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid rgba(23, 32, 42, 0.12);
            border-radius: 14px;
            padding: 30px;
        }

        .auth-brand {
            margin: 0;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 0;
            font-weight: 700;
        }

        .auth-subtitle {
            margin: 8px 0 16px;
            color: #637083;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .auth-form {
            margin-top: 8px;
            display: grid;
            gap: 12px;
        }

        .auth-field {
            display: grid;
            gap: 6px;
        }

        .auth-label {
            font-size: 0.8rem;
            color: #637083;
        }

        .auth-input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid rgba(23, 32, 42, 0.12);
            border-radius: 10px;
            background: #f6f8fa;
            box-sizing: border-box;
            font-size: 1rem;
            color: #17202a;
        }

        .auth-submit {
            min-height: 44px;
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #0f766e;
            color: #fff;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
        }

        .auth-link {
            color: #2563eb;
            text-align: center;
            display: block;
            margin-top: 14px;
            text-decoration: none;
            font-size: 0.86rem;
        }

        .auth-clock {
            position: fixed;
            inset: 12px 12px auto auto;
            color: #637083;
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='magi-site.css') }}?v=20260619-auth-mobile-v3">
</head>

<body class="site-auth auth-page">
    <time class="auth-clock" id="login-clock" datetime="">--:--:--</time>
    <main class="auth-shell">
        <section class="auth-card" aria-label="MAGI 登入">
            <p class="auth-brand">MAGI Gateway</p>
            <p class="auth-subtitle">內部作業入口登入</p>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <p class="auth-flash" role="status">{{ messages[0] }}</p>
            {% endif %}
            {% endwith %}
            <form method="post" class="auth-form" novalidate>
                <label class="auth-field">
                    <span class="auth-label">帳號</span>
                    <input class="auth-input" type="text" name="username" autocomplete="username" placeholder="輸入帳號" required>
                </label>
                <label class="auth-field">
                    <span class="auth-label">密碼</span>
                    <input class="auth-input" type="password" name="password" autocomplete="current-password" placeholder="輸入密碼" required>
                </label>
                <input type="hidden" name="next" value="{{ next_target or '' }}">
                {% if mobile_app_login %}<input type="hidden" name="mobile_app" value="1">{% endif %}
                <button class="auth-submit" type="submit">登入</button>
            </form>
            <a class="auth-link" href="{{ url_for('register', next=next_target or '') }}">建立新使用者</a>
        </section>
    </main>
    <script>
        (function () {
            const clock = document.getElementById("login-clock");
            if (!clock) return;
            const render = () => {
                const now = new Date();
                clock.setAttribute("datetime", now.toISOString());
                clock.textContent = new Intl.DateTimeFormat("zh-TW", {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: false,
                }).format(now);
            };
            render();
            window.setInterval(render, 1000);
        })();
    </script>
</body>

</html>
