<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGI Mobile</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 18% 10%, #0d3340, #07111b 48%, #03070d);
      color: #edfefe;
    }
    main {
      width: min(420px, calc(100% - 32px));
      padding: 24px;
      border: 1px solid rgba(0, 239, 255, .32);
      border-radius: 20px;
      background: rgba(7, 23, 35, .94);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }
    p {
      margin: 0;
      color: #9bcbd0;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <h1>MAGI Mobile</h1>
    <p>正在連線到 Tailscale MAGI...</p>
  </main>
</body>
</html>
